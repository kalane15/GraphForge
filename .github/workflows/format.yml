name: C# formatting

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: dotnet restore GraphForge.sln
      # Build the source generator so formatting can resolve generated node types.
      - run: dotnet build GraphForge.sln --no-restore
      - run: dotnet format GraphForge.sln --verify-no-changes --no-restore
